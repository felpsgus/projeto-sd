syntax = "proto3";

option csharp_namespace = "TodoList.Contracts.Identity.V1";

package identity.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Fronteira de rede entre o Tasks Service (cliente), o API Gateway (cliente)
// e o Identity Service (servidor) — o único caminho pelo qual os outros
// serviços falam com o Identity (D-29). Alterar este arquivo e recompilar
// propaga a mudança para todos os lados em um único build (CA-07 de BE-25).
service IdentityService {
  // Valida o dono antes de criar a tarefa (RN-AUTZ-01, RN-USER-04): o
  // Tasks pergunta se o `owner_id` recebido existe e está ativo antes de
  // persistir a tarefa.
  rpc ValidateUser (ValidateUserRequest) returns (ValidateUserResponse);

  // Único caminho para validar um token fora do Identity: a chave de
  // assinatura não sai daqui (D-31). Implementado em BE-34: valida
  // assinatura, emissor, audiência e expiração. Usado pelo API Gateway para
  // não ter que guardar a chave HS256.
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);

  // Login (RN-AUTH-08): troca e-mail + senha por um access token. Recorte
  // de BE-09 para o T2 (D-36) — só o access token, sem refresh/cookie.
  rpc Login (LoginRequest) returns (LoginResponse);

  // Cadastro de usuário (BE-07, RN-AUTH-01/02/03/04/06/07). Extensão
  // aditiva da Fase 3 — o Gateway traduz `POST /api/auth/register` para
  // este RPC, no mesmo estilo de `Login` (D-36). E-mail duplicado e senha
  // fora da política são falha de negócio, sinalizada por status gRPC
  // (D-35), nunca `succeeded=false`: ao contrário de `Login`, aqui o
  // vazamento de existência é aceitável e desejável (nota técnica de
  // BE-07) — não há motivo para esconder a causa da falha.
  rpc Register (RegisterRequest) returns (RegisterResponse);

  // Consulta o perfil do usuário autenticado (BE-14, RN-USER-01/02/03). O
  // `user_id` vem do `sub` do token já validado pelo Gateway (D-38) — este
  // RPC não valida token, apenas confia no id recebido, como `ValidateUser`
  // já fazia.
  rpc GetProfile (GetProfileRequest) returns (ProfileResponse);

  // Altera o nome de exibição do usuário autenticado (BE-14, RN-USER-02).
  // Não existe campo de e-mail nesta mensagem — imutabilidade estrutural
  // (RN-USER-03), a mesma garantia de `Email` no domínio.
  rpc UpdateProfile (UpdateProfileRequest) returns (ProfileResponse);

  // Troca a senha do usuário autenticado (BE-15, RN-AUTH-04/21). Exige a
  // senha atual. A revogação de sessões (RN-AUTH-19) fica para quando
  // `refresh_tokens` existir (BE-10/BE-11, Fase 4) — ver nota técnica em
  // ChangePasswordHandler.
  rpc ChangePassword (ChangePasswordRequest) returns (google.protobuf.Empty);

  // Exclui a conta do usuário autenticado (BE-16, RN-USER-05). Exige a
  // senha atual (D-19). A remoção das tarefas do usuário acontece em
  // cascata no banco, pela FK `tasks.tasks.owner_id → identity.users(id)
  // ON DELETE CASCADE` (D-27) — este RPC não enumera nem chama o Tasks
  // Service (CA-05b de BE-16): nenhum RPC novo de exclusão de tarefas
  // entra no contrato.
  rpc DeleteAccount (DeleteAccountRequest) returns (google.protobuf.Empty);
}

message ValidateUserRequest {
  // Representação textual do Guid do usuário a validar. Trafega como
  // string, não como bytes, para ficar legível em log e nas ferramentas
  // de inspeção (custo aceito: alguns bytes a mais por chamada).
  string user_id = 1;
}

message ValidateUserResponse {
  // Verdadeiro se existe um usuário com esse id no Identity. Separado de
  // `active` porque "nunca existiu" e "existe mas está inativo"
  // (RN-USER-04) são desfechos diferentes para quem chama.
  bool exists = 1;

  // Estado atual do usuário (RN-USER-01, RN-USER-04). Só tem sentido
  // quando `exists = true`; caso contrário vem `false`.
  bool active = 2;

  // Nome de exibição do dono, para o Tasks poder exibir/registrar sem
  // manter cópia do dado (RN-AUTH-07). Único campo de usuário que
  // atravessa a fronteira — nunca e-mail nem hash de senha. String
  // vazia quando o usuário não existe, nunca null (proto3 não distingue
  // os dois).
  string display_name = 3;
}

message ValidateTokenRequest {
  // Token de acesso (JWT) emitido pelo Identity, a validar por quem está
  // fora dele — o API Gateway, único chamador (D-31).
  string access_token = 1;
}

message ValidateTokenResponse {
  // Verdadeiro se o token é válido e não expirou. Implementado em BE-34:
  // valida assinatura, issuer, audience e expiração (D-31).
  bool valid = 1;

  // Id do usuário dono do token, quando válido. String vazia quando
  // `valid = false`.
  string user_id = 2;
}

message LoginRequest {
  // E-mail informado pelo usuário, normalizado no Identity antes da busca.
  string email = 1;
  // Senha em texto puro — trafega só nesta chamada interna, nunca em log.
  string password = 2;
}

message LoginResponse {
  // Falso para e-mail inexistente, senha errada ou usuário inativo —
  // as três causas são indistinguíveis (RN-AUTH-09). Nunca status de
  // erro gRPC para credencial inválida, só para falha de infraestrutura.
  bool succeeded = 1;
  // Access token JWT, presente só quando succeeded=true.
  string access_token = 2;
  // Expiração do access token, presente só quando succeeded=true.
  google.protobuf.Timestamp expires_at = 3;
  // Id do usuário autenticado, presente só quando succeeded=true.
  string user_id = 4;
}

message RegisterRequest {
  // E-mail informado pelo visitante; normalizado (trim + lowercase) no
  // Identity antes de checar duplicidade (RN-AUTH-02/RN-AUTH-03).
  string email = 1;
  // Senha em texto puro — trafega só nesta chamada interna, nunca em log
  // (mesma regra de `LoginRequest.password`).
  string password = 2;
  // Nome de exibição opcional. String vazia (valor default de proto3) é
  // tratada como "não informado": o Identity usa a parte do e-mail antes
  // do "@" (RN-AUTH-07) — mesmo tratamento para ausente ou só espaços.
  string display_name = 3;
}

message RegisterResponse {
  // Id gerado pelo domínio (RN-USER-01), nunca pelo banco.
  string id = 1;
  // E-mail já normalizado.
  string email = 2;
  string display_name = 3;
  // Nunca contém senha nem hash (RN-AUTH-05) — a mensagem nem tem esse campo.
  google.protobuf.Timestamp created_at = 4;
}

message GetProfileRequest {
  // Id do usuário autenticado (o `sub` do token), resolvido pelo Gateway
  // antes da chamada — este RPC não valida token (BE-14).
  string user_id = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  // Obrigatório; 1–100 caracteres após trim, não pode ser só espaços
  // (RN-USER-02) — validado por `User.Rename`.
  string display_name = 2;
}

message ProfileResponse {
  string id = 1;
  string email = 2;
  string display_name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ChangePasswordRequest {
  string user_id = 1;
  // Nunca em log (RN-AUTH-05, mesma regra de LoginRequest.password).
  string current_password = 2;
  string new_password = 3;
}

message DeleteAccountRequest {
  string user_id = 1;
  // Confirmação de senha (D-19) — mesma proteção da troca de senha.
  string password = 2;
}
