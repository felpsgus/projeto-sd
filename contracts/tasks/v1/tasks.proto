syntax = "proto3";

option csharp_namespace = "TodoList.Contracts.Tasks.V1";

package tasks.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Fronteira de rede entre o API Gateway (cliente) e o Tasks Service
// (servidor) — análoga a identity.proto, mas para o domínio de tarefas.
service TasksService {
  // Cria uma tarefa (RN-TASK-10) em nome do usuário identificado pela
  // metadata gRPC "x-user-id" (D-34) — nunca por campo desta mensagem.
  rpc CreateTask (CreateTaskRequest) returns (TaskReply);
  // Lista as tarefas do dono identificado por "x-user-id" (BE-41, recorte
  // estrito de BE-22): só as não removidas, ordenadas por criação
  // decrescente, paginadas. Sem filtro, busca ou ordenação configurável —
  // isso é escopo pleno de BE-22, não desta task.
  rpc ListTasks (ListTasksRequest) returns (ListTasksReply);
  // Consulta uma tarefa específica pelo mesmo método único de resolução de
  // BE-18: filtra por dono e não-removida na própria query. Tarefa
  // inexistente e tarefa de outro dono devolvem o mesmo NotFound
  // (RN-AUTZ-03) — nunca um status que distinga os dois casos.
  rpc GetTask (GetTaskRequest) returns (TaskReply);
  // Substitui título, descrição, prioridade e vencimento de uma tarefa
  // própria (BE-19, RN-TASK-11) — semântica de PUT/substituição: um campo
  // ausente no chamador (Gateway) vira o padrão de substituição, nunca um
  // "manter o valor atual" implícito. Resolve a tarefa pelo mesmo método
  // único de BE-18/GetTask; status, dono, createdAt e completedAt não mudam
  // por este RPC (BE-19, "Não inclui").
  rpc UpdateTask (UpdateTaskRequest) returns (TaskReply);
  // Conclui uma tarefa própria Pending (RN-TASK-08). Delega a transição a
  // TodoTask.Complete (BE-05); repetir sobre uma tarefa já concluída é
  // FAILED_PRECONDITION (task.already_completed, D-35), não um 200
  // idempotente (BE-20, nota técnica).
  rpc CompleteTask (CompleteTaskRequest) returns (TaskReply);
  // Reabre uma tarefa própria Completed (RN-TASK-09), limpando
  // completed_at. Delega a transição a TodoTask.Reopen (BE-05); repetir
  // sobre uma tarefa já Pending é FAILED_PRECONDITION (task.not_completed).
  rpc ReopenTask (ReopenTaskRequest) returns (TaskReply);
  // Remove (soft delete, D-07/RN-TASK-13) uma tarefa própria — marca
  // deleted_at, nunca DELETE físico (BE-21). Devolve google.protobuf.Empty:
  // a borda REST traduz isso em 204 No Content (nenhum corpo a devolver
  // depois de remover, mesma semântica de DELETE bem-sucedido), e não há
  // nenhum dado da tarefa removida que o chamador ainda precise ler depois
  // desta chamada — quem quiser confirmar o estado final consulta GetTask
  // antes de remover, não depois.
  rpc DeleteTask (DeleteTaskRequest) returns (google.protobuf.Empty);
}

message CreateTaskRequest {
  // Título da tarefa (RN-TASK-02): 1–200 caracteres, não só espaços.
  string title = 1;
  // Descrição opcional (RN-TASK-03): até 2000 caracteres. `optional`
  // distingue "não informado" de "informado como vazio" — proto3 sem
  // `optional` não faz essa distinção (ver BE-32).
  optional string description = 2;
  // Prioridade (RN-TASK-04). TASK_PRIORITY_UNSPECIFIED equivale a
  // "não informado" e o servidor aplica o padrão Média.
  TaskPriority priority = 3;
  // Data de vencimento opcional, no formato yyyy-MM-dd (RN-TASK-05).
  // String, não google.type.Date (ver BE-32).
  optional string due_date = 4;
}

enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_MEDIUM = 2;
  TASK_PRIORITY_HIGH = 3;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_COMPLETED = 2;
}

message TaskReply {
  // Id gerado pelo Tasks Service.
  string id = 1;
  // Título da tarefa, como persistido.
  string title = 2;
  // Descrição, se houver. optional para distinguir ausente de vazio.
  optional string description = 3;
  // Prioridade efetiva (nunca UNSPECIFIED numa resposta).
  TaskPriority priority = 4;
  // Estado atual (RN-TASK-06). Nasce PENDING (RN-TASK-07).
  TaskStatus status = 5;
  // Data de vencimento, se houver, no formato yyyy-MM-dd.
  optional string due_date = 6;
  // Verdadeiro se vencida e ainda pendente (RN-TASK-16), calculado pelo
  // Tasks Service a partir de x-client-date (D-18/D-34).
  bool is_overdue = 7;
  // Data/hora de conclusão (RN-TASK-08), presente só se status=COMPLETED.
  google.protobuf.Timestamp completed_at = 8;
  // Data/hora de criação.
  google.protobuf.Timestamp created_at = 9;
  // Data/hora da última alteração (RN-TASK-14).
  google.protobuf.Timestamp updated_at = 10;
}

// Request de ListTasks (BE-41, recorte de BE-22/RN-LIST-07). Ambos os campos
// aceitam o valor 0 (default do proto3 para int32) como "não informado" — o
// Tasks Service aplica page=1 e page_size=Paging:DefaultPageSize nesse caso
// (D-09). Fora dos limites (page/page_size negativos, ou page_size acima de
// Paging:MaxPageSize) é erro de validação, nunca truncamento silencioso.
message ListTasksRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// Reply de ListTasks. total_count é o total de tarefas do dono (não
// removidas), não o total da página (BE-41, CA-08) — o cliente calcula
// totalPages a partir dele, se precisar.
message ListTasksReply {
  repeated TaskReply items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}

// Request de GetTask. Id como string (mesmo formato de TaskReply.id) — o
// Tasks Service rejeita um valor que não seja um Guid válido como erro de
// validação; não é papel deste RPC decidir 400 vs. 404 de rota, isso é do
// Gateway (BE-41, nota técnica).
message GetTaskRequest {
  string id = 1;
}

// Request de UpdateTask (BE-19) — substituição completa dos campos
// editáveis. Mesma estrutura de campo de CreateTaskRequest, com "id" à
// frente (campo 1) para identificar a tarefa; title/description/priority/
// due_date reaproveitam os mesmos números relativos de CreateTaskRequest
// para reduzir a distância cognitiva entre as duas mensagens.
//
// Semântica de substituição (BE-19, nota técnica): "description" e
// "due_date" ausentes (proto3 `optional`, HasDescription/HasDueDate=false)
// viram null — limpam o campo. "priority" ausente
// (TASK_PRIORITY_UNSPECIFIED) volta ao padrão Média, o mesmo comportamento
// de CreateTaskRequest. "title" é sempre obrigatório: um valor vazio não é
// "ausente", é erro de validação (mesma regra de CreateTaskRequest).
message UpdateTaskRequest {
  string id = 1;
  string title = 2;
  optional string description = 3;
  TaskPriority priority = 4;
  optional string due_date = 5;
}

// Request de CompleteTask (BE-20) — só o id; RN-TASK-08 não recebe nenhum
// outro parâmetro do chamador (completed_at vem do relógio do servidor).
message CompleteTaskRequest {
  string id = 1;
}

// Request de ReopenTask (BE-20) — só o id; RN-TASK-09 idem.
message ReopenTaskRequest {
  string id = 1;
}

// Request de DeleteTask (BE-21) — só o id; RN-TASK-12/13 (soft delete).
message DeleteTaskRequest {
  string id = 1;
}
