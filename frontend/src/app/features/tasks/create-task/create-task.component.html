<h1>Nova tarefa</h1>

<app-task-form
  submitLabel="Criar tarefa"
  submittingLabel="Criando…"
  (save)="onSave($event)"
  (cancelled)="cancel()"
/>

<app-confirm-dialog
  title="Sair sem salvar?"
  message="Existem alterações não salvas."
  confirmLabel="Sair sem salvar"
  (confirmed)="answerLeave(true)"
  (cancelled)="answerLeave(false)"
/>
