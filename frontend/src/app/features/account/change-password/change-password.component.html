<h1>Alterar senha</h1>

<p class="change-password__notice" role="status">
  Ao alterar a senha, você será desconectado e precisará entrar novamente com a nova senha.
</p>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="change-password__field">
    <label for="currentPassword">Senha atual</label>
    <div class="change-password__password-wrapper">
      <input
        id="currentPassword"
        [type]="showCurrentPassword() ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
        [attr.aria-invalid]="hasError('currentPassword')"
        [attr.aria-describedby]="hasError('currentPassword') ? 'currentPassword-error' : null"
      />
      <button
        type="button"
        class="change-password__toggle-visibility"
        [attr.aria-label]="showCurrentPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        (click)="toggleCurrentPasswordVisibility()"
      >
        {{ showCurrentPassword() ? 'Ocultar' : 'Mostrar' }}
      </button>
    </div>
    <app-form-field-error
      fieldId="currentPassword-error"
      [messages]="fieldMessages('currentPassword')"
    />
  </div>

  <div class="change-password__field">
    <label for="newPassword">Nova senha</label>
    <div class="change-password__password-wrapper">
      <input
        id="newPassword"
        [type]="showNewPassword() ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
        [attr.aria-invalid]="hasError('newPassword')"
        [attr.aria-describedby]="hasError('newPassword') ? 'newPassword-error' : null"
      />
      <button
        type="button"
        class="change-password__toggle-visibility"
        [attr.aria-label]="showNewPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        (click)="toggleNewPasswordVisibility()"
      >
        {{ showNewPassword() ? 'Ocultar' : 'Mostrar' }}
      </button>
    </div>
    <app-password-requirements [password]="form.controls.newPassword.value" />
    <app-form-field-error fieldId="newPassword-error" [messages]="fieldMessages('newPassword')" />
  </div>

  <div class="change-password__field">
    <label for="confirmNewPassword">Confirmar nova senha</label>
    <input
      id="confirmNewPassword"
      type="password"
      formControlName="confirmNewPassword"
      autocomplete="new-password"
      [attr.aria-invalid]="hasError('confirmNewPassword')"
      [attr.aria-describedby]="hasError('confirmNewPassword') ? 'confirmNewPassword-error' : null"
    />
    <app-form-field-error
      fieldId="confirmNewPassword-error"
      [messages]="fieldMessages('confirmNewPassword')"
    />
  </div>

  @if (formError(); as message) {
    <p class="change-password__error" role="alert" aria-live="assertive" tabindex="-1" #formError>
      {{ message }}
    </p>
  }

  <button
    type="submit"
    class="change-password__submit"
    [disabled]="submitting()"
    [attr.aria-busy]="submitting()"
  >
    {{ submitting() ? 'Alterando…' : 'Alterar senha' }}
  </button>
</form>
