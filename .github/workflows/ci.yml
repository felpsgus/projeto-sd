# Pipeline de PR (BE-24 CA-08..20, FE-23). Gates e comandos locais equivalentes: README, "CI e gates".
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore # warnings são erro (Directory.Build.props)
      - run: dotnet format --verify-no-changes --no-restore
      # Suíte inteira (Docker do runner serve o Testcontainers) + relatório + gate de cobertura (75% global, 85% Domain+Application).
      - name: Testes, cobertura e gate
        shell: pwsh
        run: ./scripts/coverage.ps1 -NoBuild
      - name: Resumo de cobertura no PR
        if: always()
        run: '[ -f coverage-report/SummaryGithub.md ] && cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: coverage-report/
          if-no-files-found: ignore
      - name: Pacotes NuGet vulneráveis (High/Critical)
        shell: pwsh
        run: ./scripts/check-vulnerable.ps1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage # pisos no vitest.config.ts
      - name: Resumo de cobertura no PR
        if: always()
        run: '[ -f coverage/frontend/coverage-summary.json ] && node scripts/coverage-summary.mjs || true' # avisa queda vs coverage-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      - run: npm run build
      - name: Build de produção sem source maps
        run: |
          if find dist -name '*.map' | grep -q .; then find dist -name '*.map'; echo 'dist/ contém .map'; exit 1; fi
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4 # dotnet ef (migrations -> SQL) e build dos scripts
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet tool restore
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Stack (compose) + suíte E2E
        run: npm run e2e:stack
        working-directory: frontend
      - name: Logs da stack
        if: failure()
        run: docker compose --profile full logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            compose-logs.txt
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico inteiro: segredo removido num commit posterior continua vazado
      # CLI oficial via imagem (a gitleaks-action exige licença em organizações). Config: .gitleaks.toml.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
